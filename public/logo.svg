<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f5c"/>
      <stop offset="1" stop-color="#150c22"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b565e8"/>
      <stop offset="1" stop-color="#f04fc4"/>
    </linearGradient>
  </defs>
  <!-- nền badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#neon)" stroke-width="2.5"/>
  <!-- tai mèo -->
  <path d="M17 26 L13.5 11.5 L27 18.5" fill="#1e1526" stroke="#b565e8" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M47 26 L50.5 11.5 L37 18.5" fill="#1e1526" stroke="#b565e8" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- đầu -->
  <rect x="13" y="19" width="38" height="29" rx="12" fill="#1e1526" stroke="#b565e8" stroke-width="2.6"/>
  <!-- mắt nửa nhắm (tsundere) -->
  <path d="M20.5 32 q4 -4.6 8 0" fill="none" stroke="#f04fc4" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M35.5 32 q4 -4.6 8 0" fill="none" stroke="#f04fc4" stroke-width="2.8" stroke-linecap="round"/>
  <!-- má hồng -->
  <ellipse cx="21" cy="38" rx="3.4" ry="1.9" fill="#f9a8d4" opacity="0.85"/>
  <ellipse cx="43" cy="38" rx="3.4" ry="1.9" fill="#f9a8d4" opacity="0.85"/>
  <!-- quyển truyện -->
  <path d="M24 44.5 h8 l0.5 3 h-8 z" fill="none" stroke="url(#neon)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M32.5 44.5 h8 l-0.5 3 h-8 z" fill="none" stroke="url(#neon)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- lông mày / vệt lông -->
  <path d="M31 25.5 h2" stroke="#c9a0e8" stroke-width="2" stroke-linecap="round"/>
</svg>
